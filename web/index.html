<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SISIP - Sistem Informasi Sekolah Indonesia Pintar</title>
  <meta name="description" content="SISIP adalah aplikasi administrasi sekolah internal untuk absensi, penilaian, jadwal, dan laporan akademik. Bukan aplikasi publik/komersial.">
  <meta name="robots" content="noindex, nofollow">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net https://unpkg.com 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; font-src 'self' https://cdnjs.cloudflare.com data:; img-src 'self' data: https:; connect-src 'self' https://*.supabase.co https:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'">
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha384-iw3OoTErCYJJB9mCa8LNS2hbsQ7M3C0EpIsO/H5+EGAkPGc6rk+V8i04oW/K5xq0" crossorigin="anonymous" referrerpolicy="no-referrer">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js" integrity="sha256-hZaWX+kY5lZgChtWjToWj1wNPSKmAIhrtvRKZVXbAec=" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="js/utils.js?v=20260930e"></script>
  <script src="js/app.js?v=20260930e" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11" integrity="sha384-nLoOnA/BDh8A/jxqtckg4DumuCGOBYUnNJLZdQz/zfYNp3wcjGSoWTAzgko06G/2" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript" integrity="sha384-c9d8RFSL+u3exBOJ4Yp3HUJXS4znl9f+z66d1y54ig+ea249SpqR+w1wyvXz/lk+" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js" integrity="sha384-vtjasyidUo0kW94K5MXDXntzOJpQgBKXmE7e2Ga4LG0skTTLeBi97eFAXsqewJjw" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
</head>
<body class="bg-gradient-to-br from-blue-900 via-slate-800 to-slate-900 text-slate-100 min-h-screen flex font-sans overflow-hidden">

  <!-- ================= VIEW: LOGIN ================= -->
  <div id="view-login" class="w-full h-screen flex items-center justify-center p-4 z-10 relative">
    <div class="absolute top-10 left-10 w-72 h-72 bg-blue-500 rounded-full mix-blend-multiply filter blur-3xl opacity-30 animate-blob"></div>
    <div class="absolute top-10 right-10 w-72 h-72 bg-purple-500 rounded-full mix-blend-multiply filter blur-3xl opacity-30 animate-blob animation-delay-2000"></div>

    <div class="glass-card p-8 w-full max-w-md rounded-2xl relative z-10 shadow-2xl">
      <button type="button" onclick="bukaPengaturanServer()" title="Konfigurasi Server (khusus admin/teknisi — jangan diubah tanpa arahan)" class="absolute top-3 right-3 w-8 h-8 rounded-full bg-white/10 hover:bg-white/20 text-slate-300 hover:text-white flex items-center justify-center transition"><i class="fa-solid fa-gear text-xs"></i></button>
      <div class="text-center mb-8">
        <img id="login-logo" src="assets/logo.svg" alt="Logo SISIP" class="w-16 h-16 rounded-2xl mx-auto shadow-lg mb-3 object-contain bg-white/10" onerror="this.style.display='none';document.getElementById('login-logo-fallback').style.display='flex';">
        <div id="login-logo-fallback" style="display:none" class="w-16 h-16 bg-blue-600 rounded-2xl mx-auto items-center justify-center text-white text-2xl font-bold shadow-lg mb-3">
          <i class="fa-solid fa-graduation-cap"></i>
        </div>
        <h1 class="text-2xl font-bold text-white mb-1">SISIP</h1>
        <p class="text-slate-300 text-xs">Sistem Informasi Sekolah Indonesia Pintar <br> (Aplikasi Administrasi Sekolah Internal)</p>
        <p class="text-slate-500 text-[9px] mt-1">Hanya untuk pengguna internal (guru, staf, siswa) sekolah terdaftar.</p>
      </div>

      
      <form id="form-login" class="space-y-4">
        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1">NIP / NIS / Email</label>
          <div class="relative">
            <span class="absolute left-3 top-3 text-slate-400"><i class="fa-solid fa-user"></i></span>
            <input type="text" id="username" class="w-full pl-10 pr-4 py-2 bg-white/10 border border-white/20 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-white placeholder-slate-400 text-sm transition" placeholder="Masukkan NIP, NIS, atau Email" required>
          </div>
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1">Password</label>
          <div class="relative">
            <span class="absolute left-3 top-3 text-slate-400"><i class="fa-solid fa-lock"></i></span>
            <input type="password" id="password" class="w-full pl-10 pr-4 py-2 bg-white/10 border border-white/20 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-white placeholder-slate-400 text-sm transition" placeholder="Masukkan Password" required>
          </div>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-medium text-slate-300 mb-1">Tahun Pelajaran</label>
            <select id="login-tahun" class="w-full px-2 py-2 bg-white/10 border border-white/20 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-white text-sm transition"></select>
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-300 mb-1">Semester</label>
            <select id="login-semester" class="w-full px-2 py-2 bg-white/10 border border-white/20 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-white text-sm transition">
              <option value="Ganjil" class="bg-slate-800">Ganjil</option>
              <option value="Genap" class="bg-slate-800">Genap</option>
            </select>
          </div>
        </div>
        <button type="submit" id="btn-login" class="w-full py-2.5 mt-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-semibold text-sm transition-all shadow-lg flex justify-center items-center gap-2">
          <span>Masuk</span> <i class="fa-solid fa-arrow-right"></i>
        </button>
        <button type="button" onclick="lupaPassword()" class="block mx-auto text-[10px] text-blue-300 hover:text-blue-200 underline transition">Lupa Password?</button>

        <div class="flex items-center gap-2 pt-1">
          <span class="flex-1 h-px bg-white/20"></span>
          <span class="text-[10px] text-slate-400 uppercase tracking-wider">atau</span>
          <span class="flex-1 h-px bg-white/20"></span>
        </div>

        <button type="button" id="btn-login-google" class="w-full py-2.5 bg-slate-800 hover:bg-slate-700 border border-white/20 text-white rounded-lg font-semibold text-sm transition-all shadow-lg flex justify-center items-center gap-2">
          <i class="fa-brands fa-google text-lg"></i> <span>Masuk dengan Google</span>
        </button>
      </form>
    </div>
  </div>



  <!-- ================= VIEW: DASHBOARD ================= -->
  <div id="view-dashboard" class="hidden w-full h-screen flex">
    
    <main class="flex-1 flex flex-col h-full overflow-hidden relative">
      <header class="h-14 glass-header flex items-center justify-between px-4 z-10 flex-shrink-0">
        <div class="flex items-center gap-3">
          <button id="btn-toggle-sidebar" class="text-slate-300 hover:text-white p-2 rounded-lg hover:bg-white/10 transition" title="Menu">
            <i class="fa-solid fa-bars text-base"></i>
          </button>
          <h2 class="text-sm sm:text-base font-semibold text-white uppercase truncate" id="page-title">Dashboard</h2>
        </div>
        
        <div class="flex items-center gap-4 sm:gap-6">
          <div class="hidden md:flex flex-col text-right">
            <span id="realtime-clock" class="text-sm font-mono text-blue-300 font-bold">00:00:00</span>
            <span id="realtime-date" class="text-[10px] sm:text-xs text-slate-400">Senin, 1 Jan 2026</span>
          </div>
          <div class="flex items-center gap-1.5 pl-2 sm:pl-3 border-l border-white/20">
            <select id="header-tahun" onchange="gantiPreferensiHeader()" title="Tahun Pelajaran" class="bg-slate-900/70 border border-white/10 rounded-lg px-1.5 py-1 text-[10px] sm:text-xs text-white outline-none max-w-[120px]"></select>
            <select id="header-semester" onchange="gantiPreferensiHeader()" title="Semester" class="bg-slate-900/70 border border-white/10 rounded-lg px-1.5 py-1 text-[10px] sm:text-xs text-white outline-none">
              <option value="Ganjil" class="bg-slate-800">Ganjil</option>
              <option value="Genap" class="bg-slate-800">Genap</option>
            </select>
          </div>
          <div class="flex items-center gap-3 pl-3 sm:pl-4 border-l border-white/20">
            <div class="w-8 h-8 sm:w-9 sm:h-9 rounded-full bg-gradient-to-tr from-blue-600 to-indigo-500 flex items-center justify-center text-white font-bold shadow-md" id="user-initial">A</div>
            <div class="hidden sm:block leading-tight">
              <p class="text-sm font-semibold text-white truncate max-w-[120px]" id="user-name">Nama User</p>
              <p class="text-[10px] text-blue-300 uppercase tracking-wide" id="user-role">Role</p>
            </div>
          </div>
        </div>
      </header>

      <!-- Konten Utama -->
      <div id="main-content" class="flex-1 p-3 sm:p-5 overflow-y-auto z-0"></div>
    </main>
  </div>

  
</body>
</html>
