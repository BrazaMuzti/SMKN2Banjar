<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SISIP — Tidak Ada Koneksi</title>
  <meta name="theme-color" content="#0f172a">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg">
  <!-- CSS dari cache service worker (relatif: situs ini project page /repo/) -->
  <link rel="stylesheet" href="css/style.css?v=20261028f">
  <style>
    body { background-color: #0f172a; color: #cbd5e1; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; text-align: center; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .kotak-offline { max-width: 460px; padding: 24px; }
    .ikon-offline { width: 72px; height: 72px; margin: 0 auto 18px; border-radius: 9999px; display: flex; align-items: center; justify-content: center; font-size: 34px; background: rgba(245, 158, 11, 0.15); border: 1px solid rgba(245, 158, 11, 0.35); }
    h1 { color: #f8fafc; font-size: 1.6rem; margin: 0 0 10px; }
    p { font-size: 0.95rem; color: #94a3b8; margin: 0 0 22px; line-height: 1.6; }
    button { background-color: #2563eb; color: #fff; border: 0; padding: 11px 22px; border-radius: 10px; font-weight: 700; font-size: 0.9rem; cursor: pointer; transition: background-color .2s; }
    button:hover { background-color: #1d4ed8; }
    .catatan { margin-top: 18px; font-size: 0.75rem; color: #64748b; }
  </style>
</head>
<body>
  <div class="kotak-offline">
    <div class="ikon-offline">📶</div>
    <h1>Anda Sedang Offline</h1>
    <p>
      Koneksi internet terputus sehingga data terbaru belum bisa dimuat.<br>
      Periksa koneksi Anda lalu muat ulang halaman.
    </p>
    <button type="button" onclick="window.location.reload()">Muat Ulang Halaman</button>
    <div class="catatan">SISIP — Sistem Informasi Sekolah Indonesia Pintar</div>
  </div>

  <script>
    // Pastikan service worker tetap aktif (agar aset dari cache bisa dipakai offline).
    // Path relatif ('./sw.js') penting: situs ini project page GitHub Pages, bukan root domain.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(function (err) {
        console.warn('[SW] Registrasi gagal di halaman offline:', err);
      });
    }
  </script>
</body>
</html>
